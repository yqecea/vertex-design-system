<?xml version="1.0" encoding="UTF-8"?>
<!--
  PCB Trace Pattern — Signature Move D3
  
  Board outline with copper traces, via dots, and labeled components.
  Use as a background pattern or a featured diagram.
  EDIT component designators (R1, U7, BUS-A) to match the product.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" aria-labelledby="pcb-title">
  <title id="pcb-title">PCB schematic with labeled pins</title>
  <style>
    .pcb-board    { fill: var(--bg-100, #0F1A10); stroke: var(--line-2, #2A4030); stroke-width: 1; }
    .pcb-trace    { fill: none; stroke: var(--accent, #33FF99); stroke-width: 1; opacity: 0.6; }
    .pcb-trace-2  { fill: none; stroke: color-mix(in srgb, var(--accent, #33FF99) 50%, transparent); stroke-width: 1; opacity: 0.5; }
    .pcb-via      { fill: var(--bg-000, #0A1208); stroke: var(--accent, #33FF99); stroke-width: 0.8; }
    .pcb-pad      { fill: var(--accent, #33FF99); opacity: 0.7; }
    .pcb-comp     { fill: var(--bg-200, #162214); stroke: var(--line-2, #3A5040); stroke-width: 1; }
    .pcb-label    { font-family: var(--font-mono, ui-monospace, monospace); font-size: 9px; letter-spacing: 0.04em; fill: var(--text-md, #8AAA7C); text-transform: uppercase; }
    .pcb-pin-label { font-family: var(--font-mono, ui-monospace, monospace); font-size: 7px; fill: var(--text-lo, #5A7A4E); }
  </style>

  <!-- Board outline -->
  <rect class="pcb-board" x="20" y="20" width="560" height="320" rx="4"/>

  <!-- Board name (top-left corner) -->
  <text class="pcb-label" x="32" y="40">BOARD REV C · 12-LAYER · ALL PATHS VERIFIED</text>

  <!-- Traces (horizontal bus) -->
  <path class="pcb-trace"   d="M 60 100 H 540"/>
  <path class="pcb-trace"   d="M 60 140 H 540"/>
  <path class="pcb-trace-2" d="M 60 180 H 540"/>
  <path class="pcb-trace-2" d="M 60 220 H 540"/>
  <text class="pcb-label" x="30" y="103">BUS-A</text>
  <text class="pcb-label" x="30" y="143">BUS-B</text>
  <text class="pcb-label" x="30" y="183">PWR</text>
  <text class="pcb-label" x="30" y="223">GND</text>

  <!-- Vertical traces -->
  <path class="pcb-trace-2" d="M 150 100 V 280"/>
  <path class="pcb-trace-2" d="M 300 100 V 280"/>
  <path class="pcb-trace-2" d="M 450 100 V 280"/>

  <!-- Vias at intersections -->
  <circle class="pcb-via" cx="150" cy="100" r="3"/>
  <circle class="pcb-via" cx="150" cy="140" r="3"/>
  <circle class="pcb-via" cx="150" cy="180" r="3"/>
  <circle class="pcb-via" cx="300" cy="100" r="3"/>
  <circle class="pcb-via" cx="300" cy="140" r="3"/>
  <circle class="pcb-via" cx="300" cy="180" r="3"/>
  <circle class="pcb-via" cx="450" cy="100" r="3"/>
  <circle class="pcb-via" cx="450" cy="140" r="3"/>
  <circle class="pcb-via" cx="450" cy="180" r="3"/>

  <!-- Component R1 -->
  <rect class="pcb-comp" x="120" y="240" width="60" height="28"/>
  <text class="pcb-label" x="150" y="258" text-anchor="middle">R1</text>
  <text class="pcb-pin-label" x="150" y="285" text-anchor="middle">RATE LIMIT</text>

  <!-- Component U7 -->
  <rect class="pcb-comp" x="260" y="240" width="80" height="40"/>
  <text class="pcb-label" x="300" y="258" text-anchor="middle">U7</text>
  <text class="pcb-pin-label" x="300" y="272" text-anchor="middle">AUTH-CTRL</text>
  <text class="pcb-pin-label" x="300" y="298" text-anchor="middle">8-bit, 16-pin</text>
  <!-- pins on U7 -->
  <rect class="pcb-pad" x="265" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="275" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="285" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="295" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="305" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="315" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="325" y="280" width="2" height="5"/>
  <rect class="pcb-pad" x="333" y="280" width="2" height="5"/>

  <!-- Component C4 -->
  <rect class="pcb-comp" x="420" y="240" width="60" height="28"/>
  <text class="pcb-label" x="450" y="258" text-anchor="middle">C4</text>
  <text class="pcb-pin-label" x="450" y="285" text-anchor="middle">CACHE</text>

  <!-- Edge connector (right side) -->
  <g>
    <rect class="pcb-pad" x="575" y="95"  width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="105" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="135" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="145" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="175" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="185" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="215" width="8" height="3"/>
    <rect class="pcb-pad" x="575" y="225" width="8" height="3"/>
  </g>
  <text class="pcb-pin-label" x="585" y="170" transform="rotate(90 585 170)">EDGE J1</text>
</svg>
